<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — ResumeForge AI</title>
<link rel="stylesheet" href="/static/output.css" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-ink-50 font-sans antialiased min-h-screen">
<nav class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-ink-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2">
      <img src="/static/logo.svg" alt="ResumeForge AI" class="w-8 h-8" />
      <span class="font-bold text-lg">ResumeForge <span class="text-brand-600">AI</span></span>
    </a>
    <div class="flex items-center gap-2">
      <a href="/about" class="px-3 py-2 text-sm text-ink-600 hover:text-ink-900">About</a>
      <a href="/contact" class="px-3 py-2 text-sm text-ink-600 hover:text-ink-900">Contact</a>
      <a href="/login" class="px-4 py-2 rounded-xl bg-white border border-ink-200 text-sm font-medium hover:bg-ink-50">Sign in</a>
      <a href="/signup" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-medium hover:bg-brand-700">Sign up</a>
    </div>
  </div>
</nav>
<main class="max-w-5xl mx-auto px-4 py-16 grid lg:grid-cols-2 gap-10">
  <div>
    <h1 class="text-3xl font-extrabold mb-4">Get in touch</h1>
    <p class="text-ink-500 mb-6">Have a question, feedback, or need help? We'd love to hear from you.</p>
    <div class="card p-6 space-y-4">
      <div>
        <div class="text-xs text-ink-400">Email</div>
        <a href="mailto:mazenshatla78@gmail.com" class="font-medium text-brand-600 hover:underline">mazenshatla78@gmail.com</a>
      </div>
      <div>
        <div class="text-xs text-ink-400">Response time</div>
        <div class="font-medium">Within 24-48 hours</div>
      </div>
      <div>
        <div class="text-xs text-ink-400">Support</div>
        <div class="font-medium">Technical, billing, and account questions</div>
      </div>
    </div>
  </div>
  <div class="card p-6">
    <h2 class="font-semibold mb-4">Send a message</h2>
    <div class="space-y-3">
      <div>
        <label class="label">Name</label>
        <input class="input" placeholder="Your name" />
      </div>
      <div>
        <label class="label">Email</label>
        <input type="email" class="input" placeholder="you@example.com" />
      </div>
      <div>
        <label class="label">Message</label>
        <textarea rows="5" class="input" placeholder="How can we help?"></textarea>
      </div>
      <button onclick="alert('Thanks! We will get back to you at mazenshatla78@gmail.com')" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-brand-700 text-white font-semibold hover:shadow-lg transition">Send message</button>
    </div>
  </div>
</main>
</body>
</html>
